<!DOCTYPE html>
<html>
<body>

<h2>Calculator</h2>

Number 1:
<input type="number" id="n1"><br><br>

Number 2:
<input type="number" id="n2"><br><br>

<button onclick="calculate()">Submit</button>

<p id="result"></p>

<script>
function calculate()
{
    let a = parseFloat(document.getElementById("n1").value);
    let b = parseFloat(document.getElementById("n2").value);

    let sum = a + b;
    let sub = a - b;
    let mul = a * b;
    let div = a / b;

    document.getElementById("result").innerHTML =
        "Sum = " + sum + "<br>" +
        "Difference = " + sub + "<br>" +
        "Product = " + mul + "<br>" +
        "Quotient = " + div;
}
</script>

</body>
</html>
