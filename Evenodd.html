<!DOCTYPE html>
<html>
<body>

<input type="number" id="num">
<button onclick="check()">Check</button>

<p id="ans"></p>

<script>
function check()
{
    let n = document.getElementById("num").value;

    if(n % 2 == 0)
    {
        document.getElementById("ans").innerHTML = "Even Number";
    }
    else
    {
        document.getElementById("ans").innerHTML = "Odd Number";
    }
}
</script>

</body>
</html>
