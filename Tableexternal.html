<!DOCTYPE html>
<html>
<head>
    <title>Table Example</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<table>
    <caption>A test table with merged cells</caption>

    <tr>
        <th rowspan="2"></th>
        <th colspan="2">Average</th>
        <th rowspan="2">Red Eyes</th>
    </tr>

    <tr>
        <th>Height</th>
        <th>Weight</th>
    </tr>

    <tr class="male">
        <th>Males</th>
        <td>1.9</td>
        <td>0.003</td>
        <td>40%</td>
    </tr>

    <tr class="female">
        <th>Females</th>
        <td>1.7</td>
        <td>0.002</td>
        <td>43%</td>
    </tr>
</table>

</body>
</html>
