<!DOCTYPE html>
<html>
<head>
    <title>Uppercase and Lowercase Example</title>
</head>
<body>

<script>
    // String
    let text = "Hello JavaScript";

    // Convert to uppercase
    let upper = text.toUpperCase();

    // Convert to lowercase
    let lower = text.toLowerCase();

    // Display output
    document.write("Original String: " + text + "<br>");
    document.write("Uppercase: " + upper + "<br>");
    document.write("Lowercase: " + lower);
</script>

</body>
</html>
