<!DOCTYPE html>
<html>
<head>
<style>
div{
    width:300px;
    height:150px;
    border:2px solid black;
    text-align:center;
    line-height:150px;
}
</style>

<script>
function changeColor()
{
    document.getElementById("box").style.backgroundColor="yellow";
}

function normalColor()
{
    document.getElementById("box").style.backgroundColor="white";
}
</script>
</head>

<body>

<div id="box" onmouseover="changeColor()" onmouseout="normalColor()">
Move Mouse Here
</div>

</body>
</html>
