<!DOCTYPE html>
<html>
<head>
    <title>Implicit Conversion</title>
</head>
<body>

<script>
    let result;

    // Number + String
    result = 5 + "5";
    document.write("5 + '5' = " + result + "<br>");

    // Boolean + Number
    result = true + 1;
    document.write("true + 1 = " + result + "<br>");

    // String - Number
    result = "10" - 5;
    document.write("'10' - 5 = " + result + "<br>");
</script>

</body>
</html>
