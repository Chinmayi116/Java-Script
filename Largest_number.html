<!DOCTYPE html>
<html>
<head>
    <title>Largest Number</title>
</head>
<body>

<script>
let a = 10;
let b = 25;
let c = 15;

if(a > b && a > c)
{
    document.write("A is Largest");
}
else if(b > c)
{
    document.write("B is Largest");
}
else
{
    document.write("C is Largest");
}
</script>

</body>
</html>
