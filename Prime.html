<!DOCTYPE html>
<html>
<body>

<input type="number" id="num">
<button onclick="prime()">Check</button>

<p id="ans"></p>

<script>

function prime()
{
    let n = document.getElementById("num").value;
    let flag = 0;

    for(let i=2; i<n; i++)
    {
        if(n % i == 0)
        {
            flag = 1;
            break;
        }
    }

    if(n > 1 && flag == 0)
    {
        document.getElementById("ans").innerHTML = "Prime Number";
    }
    else
    {
        document.getElementById("ans").innerHTML = "Not Prime";
    }
}

</script>

</body>
</html>
