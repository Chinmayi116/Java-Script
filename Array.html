<!DOCTYPE html>
<html>
<head>
    <title>Array Operations</title>
</head>
<body>

<script>
    // Create arrays
    let arr1 = [1, 2, 3];
    let arr2 = [4, 5, 6];

    // Concatenate arrays
    let arr3 = arr1.concat(arr2);

    // Reverse array
    let arr4 = arr3.reverse();

    // Join elements with hyphen
    let result = arr4.join("-");

    // Display result
    document.write("Array 1: " + arr1 + "<br>");
    document.write("Array 2: " + arr2 + "<br>");
    document.write("Concatenated Array: " + arr3 + "<br>");
    document.write("Reversed Array: " + arr4 + "<br>");
    document.write("Joined String: " + result);
</script>

</body>
</html>
