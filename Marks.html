<!DOCTYPE html>
<html>
<head>
    <title>Grade Calculator</title>
</head>
<body>

<script>

var m1 = parseInt(prompt("Enter Marks 1"));
var m2 = parseInt(prompt("Enter Marks 2"));
var m3 = parseInt(prompt("Enter Marks 3"));
var m4 = parseInt(prompt("Enter Marks 4"));
var m5 = parseInt(prompt("Enter Marks 5"));

var total = m1 + m2 + m3 + m4 + m5;
var percentage = total / 5;

var grade;

if (percentage >= 75)
{
    grade = "Distinction";
}
else
{
    if (percentage >= 60)
    {
        grade = "First Class";
    }
    else
    {
        if (percentage >= 50)
        {
            grade = "Second Class";
        }
        else
        {
            if (percentage >= 35)
            {
                grade = "Pass";
            }
            else
            {
                grade = "Fail";
            }
        }
    }
}

document.write("Total = " + total + "<br>");
document.write("Percentage = " + percentage + "%<br>");
document.write("Grade = " + grade);

</script>

</body>
</html>
