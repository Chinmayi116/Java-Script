<!DOCTYPE html>
<html>
<head>
    <title>String Functions</title>
</head>
<body>

<script>
    // Declare string
    let text = "JavaScript is a powerful scripting language";

    // Find first occurrence of "script"
    let firstIndex = text.indexOf("script");

    // Find last occurrence of "script"
    let lastIndex = text.lastIndexOf("script");

    // Character at index 4
    let char = text.charAt(4);

    // Display results
    document.write("Text: " + text + "<br>");
    document.write("First occurrence of 'script': " + firstIndex + "<br>");
    document.write("Last occurrence of 'script': " + lastIndex + "<br>");
    document.write("Character at index 4: " + char);
</script>

</body>
</html>
